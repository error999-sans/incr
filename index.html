<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Typical Incremental Game</title>
<meta name="description" content="A free incremental game with dimensions, seven reset layers, an upgrade tree, research, achievements and a hidden story.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="title">Typical Incremental Game</h1>
  <div class="big">You have <b id="pts">10</b> points</div>
  <div class="sub"><span id="pps">0</span> points per second</div>
  <nav id="nav" role="tablist" aria-label="Sections"></nav>
</header>
<main id="main"></main>
<div id="dlg" role="dialog" aria-live="polite" hidden><b id="dn"></b><p id="dt"></p><small>Tap to continue</small></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
